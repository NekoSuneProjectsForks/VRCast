name: Session server
on:
  push:
    paths:
      - 'SessionServer/**'
      - 'SessionServer.Tests/**'
      - '.github/workflows/session-server.yml'
  pull_request:
    paths:
      - 'SessionServer/**'
      - 'SessionServer.Tests/**'
      - '.github/workflows/session-server.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build SessionServer/VRCast.SessionServer.csproj -c Release --nologo
      - run: dotnet run --project SessionServer.Tests/VRCast.SessionServer.Tests.csproj -c Release --nologo

  binaries:
    needs: verify
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - target: win-x64
            host: windows-latest
          - target: linux-x64
            host: ubuntu-latest
          - target: linux-arm64
            host: ubuntu-latest
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone server
        run: dotnet publish SessionServer/VRCast.SessionServer.csproj -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vrcast-session-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/

  container:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/vrcast-session-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: ./SessionServer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
